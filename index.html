<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in & Tarjeta de Embarque | Premios Bitácora</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Librerías QR y PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0b1120;
            --card-dark: #0f172a;
            --gold-primary: #f59e0b;
            --gold-light: #fbbf24;
            --gold-dark: #d97706;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-gold: rgba(245, 158, 11, 0.4);
            --success: #10b981;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #020617 0%, #0b1120 50%, #0f172a 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            color: var(--text-light);
        }

        .card {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            max-width: 480px;
            width: 100%;
            position: relative;
            border: 1px solid var(--border-gold);
        }

        .card-header {
            text-align: center;
            margin-bottom: 22px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4);
        }

        .card-header i.logo-icon {
            font-size: 38px;
            color: var(--gold-primary);
            margin-bottom: 8px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(to right, #ffffff, var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .card-header p {
            margin: 6px 0 0;
            font-size: 11px;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-weight: 600;
        }

        .instruction-box {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid var(--border-gold);
            border-left: 5px solid var(--gold-primary);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #fef3c7;
            line-height: 1.6;
        }

        .instruction-box ol { margin: 8px 0 0; padding-left: 20px; }
        .instruction-box li { margin-bottom: 6px; }

        .qr-container {
            text-align: center;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid var(--gold-primary);
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-container label {
            color: #0f172a;
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #f1f5f9;
        }

        input[type="email"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #334155;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
            background: #1e293b;
            color: white;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            border: 1px dashed var(--gold-primary);
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            color: #cbd5e1;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-primary) 100%);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }
